# CI for testboard.
#
# Four jobs:
#   - modern:          proves the suite runs warning-clean on current Pythons (dev machines).
#   - python36-rhel8:  THE AUTHORITATIVE GATE. Runs inside Red Hat's ubi8/python-36
#                      container — the exact RHEL 8 platform Python (3.6.8) the
#                      production server uses. Dev machines run newer interpreters,
#                      so this job is how 3.6 compatibility is really verified.
#   - python36-mariadb: the same interpreter plus a mariadb:10.3 service — the
#                      version prod runs. TESTBOARD_TEST_DB_CNF activates the
#                      generated dual-backend suites (tests/backends.py), so
#                      the storage and API tests run against BOTH engines here.
#                      SQLite is not "the CI backend" and MariaDB "the real
#                      one" — they are equal backends and both gate the merge.
#   - python36-tcl:    the same interpreter plus a bare tclsh installed (WP-29).
#                      tests/test_feeder_engines_conformance.py gates its Tcl
#                      variants on tclsh being on PATH, the same pattern
#                      TESTBOARD_TEST_DB_CNF uses for MariaDB — absent, they
#                      simply do not exist; here, they do. This proves
#                      clients/feeder.tcl actually RUNS end to end, on top of
#                      the static 8.5-construct guard (tests/test_tcl_compat.py)
#                      that runs unconditionally in every job.
name: CI

on:
  push:
  pull_request:

jobs:
  modern:
    name: Python ${{ matrix.python-version }} (ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -v

  python36-rhel8:
    name: Python 3.6.8 (RHEL 8 ubi8 container — authoritative target)
    runs-on: ubuntu-latest
    container: registry.access.redhat.com/ubi8/python-36
    steps:
      - uses: actions/checkout@v4
      - name: Show interpreter version
        run: python3 --version
      - name: Run test suite
        run: python3 -m unittest discover -v

  python36-mariadb:
    name: Python 3.6.8 + MariaDB 10.3 (dual-backend suites)
    runs-on: ubuntu-latest
    container: registry.access.redhat.com/ubi8/python-36
    services:
      mariadb:
        # 10.3 to match production (RHEL 8's default module stream),
        # NOT latest: the local dev server is newer, so this job is
        # what pins the version actually deployed against.
        image: mariadb:10.3
        env:
          # The 10.3-era image reads MYSQL_*; newer entrypoints prefer
          # MARIADB_*. Setting both is harmless and survives an image
          # refresh.
          MYSQL_ROOT_PASSWORD: testboard-ci
          MARIADB_ROOT_PASSWORD: testboard-ci
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Write the test-database credentials
        # tests/backends.py DROPs and recreates this database with the
        # runbook's collation (utf8mb4_nopad_bin) itself — no client
        # package, no bootstrap script, just the vendored driver.
        run: |
          cat > /tmp/mariadb-test.cnf <<'EOF'
          [client]
          host = mariadb
          port = 3306
          user = root
          password = testboard-ci
          database = testboard_test
          EOF
      - name: Run test suite (SQLite + MariaDB variants)
        env:
          TESTBOARD_TEST_DB_CNF: /tmp/mariadb-test.cnf
        run: python3 -m unittest discover -v

  python36-tcl:
    name: Python 3.6.8 + Tcl (single-file feeder conformance)
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi8/python-36
      # The image's default user is 1001, which cannot install packages
      # (`dnf` exits "has to be run with superuser privileges"), and the
      # image carries no `microdnf` at all -- the first run of this leg
      # failed on both. Root is needed ONLY to add tclsh; the suite
      # itself does not care who runs it.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install tclsh (bundled http package only - no tcllib, no tls)
        run: dnf install -y tcl
      - name: Show interpreter versions
        # RHEL 8 ships Tcl 8.6.8, so this leg proves clients/feeder.tcl
        # RUNS on a real tclsh -- it is NOT 8.5 verification. No 8.5
        # interpreter exists here or on any developer box; that is what
        # the static 8.5-construct gate (tests/test_tcl_compat.py) is
        # for, and the drop note says so rather than implying otherwise.
        run: |
          python3 --version
          echo 'puts [info patchlevel]' | tclsh
      - name: Run test suite (Tcl conformance variants active)
        run: python3 -m unittest discover -v
